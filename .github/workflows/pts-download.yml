name: pts-download

# Triggered by the PTS Library backend when a job is added to the queue.
# Stages: download -> 540p HEVC CRF23 MP4 + stereo AAC per language ->
# upload to the VPS. The VPS then moves the file to the Pi and clears the copy.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: PTS job id
        required: true
      url:
        description: Source download URL
        required: true
      title:
        description: Title
        required: true
      year:
        description: Release year
        required: false
      kind:
        description: movie or series
        required: false
        default: movie
      season:
        description: Season number (series only)
        required: false
      episode:
        description: Episode number (series only)
        required: false
      label:
        description: Human readable label
        required: false
      callback:
        description: Worker API base URL
        required: true
      attempt:
        description: Attempt identifier
        required: true

permissions:
  contents: read

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JOB_ID: ${{ inputs.job_id }}
      SOURCE_URL: ${{ inputs.url }}
      MEDIA_TITLE: ${{ inputs.title }}
      MEDIA_YEAR: ${{ inputs.year }}
      MEDIA_KIND: ${{ inputs.kind }}
      MEDIA_SEASON: ${{ inputs.season }}
      MEDIA_EPISODE: ${{ inputs.episode }}
      LABEL: ${{ inputs.label }}
      CALLBACK: ${{ inputs.callback }}
      ATTEMPT: ${{ inputs.attempt }}
      WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
    steps:
      - name: Ensure ffmpeg with HEVC support
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep -q libx265

      - name: Download, compress and upload
        timeout-minutes: 330
        run: |
          curl -sL -o pts_pipeline.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/pts_pipeline.py"
          python3 -u pts_pipeline.py

      - name: Report failure
        if: failure()
        timeout-minutes: 2
        run: |
          curl -sL -o pts_pipeline.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/pts_pipeline.py"
          python3 -u pts_pipeline.py --report-failure
