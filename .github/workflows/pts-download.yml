name: pts-download

# Triggered by the PTS Library backend when a job is added to the queue.
# Stages: download -> compress (540p HEVC + 256k AAC, all audio tracks) ->
# upload to the VPS. The VPS then moves the file to the Pi and clears the copy.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: PTS job id
        required: true
      url:
        description: Source download URL
        required: true
      title:
        description: Title
        required: true
      year:
        description: Release year
        required: false
      kind:
        description: movie or series
        required: false
        default: movie
      season:
        description: Season number (series only)
        required: false
      episode:
        description: Episode number (series only)
        required: false
      label:
        description: Human readable label
        required: false
      callback:
        description: Worker API base URL
        required: true

# One run per job, so different jobs process in parallel but a job never
# processes twice.
concurrency:
  group: pts-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg with HEVC support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx265

      - name: Download, compress and upload
        env:
          JOB_ID: ${{ inputs.job_id }}
          SOURCE_URL: ${{ inputs.url }}
          MEDIA_TITLE: ${{ inputs.title }}
          MEDIA_YEAR: ${{ inputs.year }}
          MEDIA_KIND: ${{ inputs.kind }}
          MEDIA_SEASON: ${{ inputs.season }}
          MEDIA_EPISODE: ${{ inputs.episode }}
          LABEL: ${{ inputs.label }}
          CALLBACK: ${{ inputs.callback }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python3 scripts/pts_pipeline.py

      - name: Report failure
        if: failure()
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK: ${{ inputs.callback }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python3 scripts/pts_pipeline.py --report-failure
